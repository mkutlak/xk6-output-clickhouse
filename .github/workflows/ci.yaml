# Job graph:
#   validate (reusable) ──┐
#     ├─ lint              │
#     └─ test              ├── (all must pass)
#   build-check ──────────┘
#   integration-tests ────┘
name: CI

on:
  pull_request:
    paths:
      - 'Dockerfile'
      - 'docker-compose.yml'
      - 'Makefile'
      - '.xk6-version'
      - '.golangci.yml'
      - 'pkg/**'
      - 'examples/**'
      - 'grafana/**'
      - 'register.go'
      - 'go.mod'
      - 'go.sum'
      - '.github/workflows/ci.yaml'
      - '.github/workflows/validate.yaml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  validate:
    name: Code Validation
    uses: ./.github/workflows/validate.yaml

  build-check:
    name: Build Verification
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Install xk6
        run: |
          XK6_VERSION=$(cat .xk6-version 2>/dev/null || echo latest)
          go install go.k6.io/xk6/cmd/xk6@${XK6_VERSION}

      - name: Build k6 with extension
        run: |
          MODULE_NAME=$(go list -m)
          xk6 build \
            --output ./k6ext \
            --with "${MODULE_NAME}=."

      - name: Verify binary
        run: |
          ./k6ext version
          file ./k6ext

  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Run integration tests
        env:
          CLICKHOUSE_VERSION: 26.10-alpine
        run: make docker-test
        timeout-minutes: 10

      - name: Collect Docker logs
        if: failure()
        run: docker compose logs > docker-logs.txt

      - name: Upload Docker logs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: docker-logs
          path: docker-logs.txt
          retention-days: 3

      - name: Clean up Docker Compose
        if: always()
        run: make docker-compose-down || true
